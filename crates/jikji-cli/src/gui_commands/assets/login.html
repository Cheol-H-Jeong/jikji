<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><meta name="robots" content="noindex,nofollow"><title>Jikji Studio · 로그인</title>
<style>
:root{--background:oklch(0.1900 0.0025 157.5);--card:oklch(0.2150 0.0025 157.5);--foreground:oklch(0.9500 0.00275 157.5);--muted-foreground:oklch(0.7980 0.00275 157.5);--border:oklch(0.95 0.00149 157.5 / 0.0751);--input:oklch(0.95 0.00138 157.5 / 0.1347);--field:oklch(0 0 0 / 0.12);--primary-solid:oklch(0.43627 0.11 157.5);--primary-solid-fg:oklch(0.95 0.00275 157.5);--destructive:oklch(0.55 0.14 25);--ring:oklch(0.76 0.15 157.5 / 0.55);font:14px/20px system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--foreground);background:var(--background)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
main{width:min(380px,100%);background:var(--card);border:1px solid var(--border);border-radius:8px;padding:32px}
h1{margin:0 0 4px;font-size:20px;line-height:28px}p{margin:0 0 24px;color:var(--muted-foreground)}
label{display:block;margin-bottom:8px;color:var(--muted-foreground);font-size:12px}
input{width:100%;padding:10px 12px;border:1px solid var(--input);border-radius:6px;background:var(--field);color:inherit;font:inherit}
button{width:100%;margin-top:16px;padding:10px 12px;border:1px solid transparent;border-radius:6px;background:var(--primary-solid);color:var(--primary-solid-fg);font:inherit;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
#error{min-height:20px;margin-top:12px;color:var(--destructive)}
</style>
</head>
<body>
<main>
<h1>Jikji Studio</h1>
<p>이 콘솔은 보호되어 있습니다. 접근 토큰을 입력하세요.</p>
<form id="login" autocomplete="off">
<label for="token">접근 토큰</label>
<input id="token" name="token" type="password" required autofocus>
<button id="submit" type="submit">로그인</button>
<div id="error" role="alert" aria-live="assertive"></div>
</form>
</main>
<script>
(()=>{"use strict";
const form=document.getElementById("login"),input=document.getElementById("token"),submit=document.getElementById("submit"),error=document.getElementById("error");
const messages={401:"접근 토큰이 올바르지 않습니다.",429:"실패가 너무 많습니다. 10분 뒤 다시 시도하세요."};
form.addEventListener("submit",async event=>{event.preventDefault();error.textContent="";submit.disabled=true;try{const response=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body:new URLSearchParams({token:input.value}),cache:"no-store"});if(response.status===204){location.replace("/");return}error.textContent=messages[response.status]||`로그인에 실패했습니다 (${response.status}).`;input.select()}catch{error.textContent="서버에 연결할 수 없습니다."}finally{submit.disabled=false}});
})();
</script>
</body>
</html>
